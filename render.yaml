services:
  - type: web
    name: studichan
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    initialDeployHook: npm run db:seed
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: studichan-db
          property: connectionString

  - type: cron
    name: studichan-university-sync
    runtime: node
    region: singapore
    plan: free
    schedule: "0 3 * * *"
    buildCommand: npm ci
    startCommand: npm run sync:universities
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: studichan-db
          property: connectionString
      - key: LIBRETRANSLATE_URL
        sync: false
      - key: LIBRETRANSLATE_API_KEY
        sync: false

databases:
  - name: studichan-db
    databaseName: studichan
    user: studichan
    region: singapore
    plan: free
